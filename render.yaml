# Render Blueprint for the Treayos calculator + MathsAI server.
# Docs: https://render.com/docs/blueprint-spec
#
# This keeps the existing Node server: it serves the web app and provides
# /api/chat, so the OpenAI key stays on the server.
#
# The free plan sleeps after inactivity, which adds a cold start to the first
# request. Change `plan` to `starter` (or another paid plan) for always-on use.

services:
  - type: web
    name: treayos-calculator
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
